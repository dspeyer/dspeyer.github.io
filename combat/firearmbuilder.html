         /* Special Features: apply(state, ctx) mutates the running totals in `state`.
            prereq(ctx) returns null if satisfied, or a warning string if not (features
            still apply their effects either way -- this is a sandbox, not a rules cop). */

             {key:'precision',  label:'Precision Manufacturing', avail:'Information',
              apply: (s) => { s.cost*=10; s.ri*=2; s.maxAtk+=10; }},
             {key:'sniper',     label:'Sniper',                  avail:'Information',
              prereq: ctx => ctx.checked.precision ? null : 'requires Precision Manufacturing',
              apply: (s) => { s.cost*=2; s.maxAtk*=2; }},
             {key:'decopump',   label:'Decorative Pump Action',  avail:'Information',
              prereq: ctx => ['Semi-Auto','Full Auto'].includes(ctx.action) ? null : 'requires Semi-Auto or Full Auto action',

              apply: (s) => { s.cost+=100; s.special.push('+4 tech bonus to attack'); }},
             {key:'lasersight', label:'Laser Sight',             avail:'Information',

         function fillSelect(sel, data, labelFn) {
             for (let k in data) {
                 let o = document.createElement('option');
                 o.value = k;
                 o.innerText = labelFn ? labelFn(k, data[k]) : k;
                 sel.appendChild(o);
             }
         }

         function init() {
             fillSelect(document.getElementById('FB-length'), lengths);
             fillSelect(document.getElementById('FB-width'), widths);
             fillSelect(document.getElementById('FB-style'), styles);
             fillSelect(document.getElementById('FB-action'), actions);
             fillSelect(document.getElementById('FB-ammo'), ammoFamilies);
             let box = document.getElementById('FB-featurebox');
             for (let f of features) {
                 let label = document.createElement('label');
                 label.style.marginRight = '1em';
                 label.style.whiteSpace = 'nowrap';
                 let cb = document.createElement('input');
                 cb.type = 'checkbox';
                 cb.id = 'FB-feat-' + f.key;
                 cb.onchange = recalc;
                 label.appendChild(cb);
                 label.appendChild(document.createTextNode(' ' + f.label));
                 if (f.hasN) {
                     let n = document.createElement('input');
                     n.type = 'number';
                     n.id = 'FB-feat-' + f.key + '-n';
                     n.min = 2;
                     n.max = 5;
                     n.value = 2;
                     n.style.width = '3em';
                     n.onchange = recalc;
                     label.appendChild(document.createTextNode(' ×'));
                     label.appendChild(n);
                 }
                 box.appendChild(label);
             }
             ['FB-length','FB-width','FB-style','FB-action','FB-ammo'].forEach(id => document.getElementById(id).onchange = recalc);
             recalc();
         }

         /* Grey out (disable) ammo options that don't have a variant matching the
            current barrel width, or that Rifled barrels can't chamber. If the
            currently-selected ammo just became invalid, jump to the first ammo
            that's still valid. */
         function updateAmmoOptions() {
             let width = widths[document.getElementById('FB-width').value];
             let style = styles[document.getElementById('FB-style').value];
             let sel = document.getElementById('FB-ammo');
             let firstOk = null;
             let currentOk = false;
             for (let opt of sel.children) {
                 let fam = opt.value;
                 let ok = (ammoFamilies[fam][width.mm] !== undefined) &&
                          (style !== styles.Rifled || /bullet/i.test(fam));
                 opt.disabled = !ok;
                 if (ok && firstOk === null) firstOk = fam;
                 if (ok && fam === sel.value) currentOk = true;
             }
             if (!currentOk && firstOk !== null) sel.value = firstOk;
         }

         function multiplyDamage(m,b) {
             if (b.indexOf(' or ')!=-1) {
                 return b.split(' or ').map(p=>multiplyDamage(m,p)).join(' or ');
             }
             if (b.indexOf('/')!=-1) {
                 let [base,div] = b.split('/');
                 div -= 0;
                 if (m/div==Math.floor(m/div)) {
                     return multiplyDamage(m/div, base);
                 } else {
                     return multiplyDamage(m,base) + '/' + div;
                 }
             }
             if (/[0-9]+d[0-9]+/.test(b)) {
                 let [n,d] = b.split('d');
                 return (m*n)+'d'+d;
             }
             return m + ' × ' + b;
         }
         
         const formatter = new Intl.NumberFormat('en-US', {
             maximumSignificantDigits: 3
         });


         function recalc() {
             updateAmmoOptions();
             let length = lengths[document.getElementById('FB-length').value];
             let width = widths[document.getElementById('FB-width').value];
             let style = styles[document.getElementById('FB-style').value];
             let actionName = document.getElementById('FB-action').value;
             let action = actions[actionName];
             let ammoFamilyName = document.getElementById('FB-ammo').value;
             let shot = ammoFamilies[ammoFamilyName][width.mm];

             let s = {weight:length.weight, cost:length.cost, ri:length.ri, maxAtk:length.maxAtk,
                       dmgMult:length.dmgMult, str:length.str, mag:length.mag, special:[]};
             let availList = [length.avail, width.avail, style.avail, action.avail];
             let warnings = [];

             if (shot) {
                 availList.push(shot.avail);
                 if (shot.special) s.special.push('Ammo: ' + shot.special);
                 if (style === styles.Rifled && !/bullet/i.test(ammoFamilyName)) {
                     warnings.push('Rifled barrels take Bullet ammo only (have ' + ammoFamilyName + ')');
                 }
             } else {
                 warnings.push('no ' + width.mm + 'mm ' + ammoFamilyName + ' exists -- ammo must be the same size as the barrel width');
             }

             s.str += width.str || 0;
             if (width.magDiv) s.mag /= width.magDiv;
             s.mag =  Math.max(1, Math.floor(s.mag));
             if (width.costMult) s.cost *= width.costMult;

             if (style.riDiv) { s.ri = Math.round(s.ri / style.riDiv); s.riSuffix = ' (long)'; } else { s.riSuffix = ''; }
             s.cost += style.cost || 0;
             s.maxAtk += style.maxAtk || 0;

             s.weight += action.weight || 0;
             s.cost += action.cost || 0;
             s.maxAtk += action.maxAtk || 0;
             if (action.fixedMag) s.mag = action.fixedMag;
             if (action.special) s.special.push(action.special);
             let reloadText = action.muzzle ? (shot.reload ? shot.reload : style.muzzleReload) : action.reload;
             if (width.reloadMult) {
                 let parsed = /([0-9]+)( .*)/.exec(reloadText);
                 if (parsed) {
                     let [_,n,u] = parsed; 
                     reloadText = (width.reloadMult * n) + u;
                 }
             }
             if (action.prereq) {
                 let ok = (action.minMm===undefined || width.mm>=action.minMm) &&
                          (action.maxMm===undefined || width.mm<=action.maxMm);
                 if (!ok) warnings.push(actionName + ' ' + action.prereq + ' (have ' + width.mm + 'mm)');
             }

             let checked = {};
             for (let f of features) checked[f.key] = document.getElementById('FB-feat-' + f.key).checked;
             let ctx = {mmWidth:width.mm, cmLength:length.cm, action:actionName, checked,
                        n: document.getElementById('FB-feat-nbarrel-n') ? parseInt(document.getElementById('FB-feat-nbarrel-n').value)||2 : 2};

             for (let f of features) {
                 if (!checked[f.key]) continue;
                 f.apply(s, ctx);
                 availList.push(f.avail);
                 if (f.prereq) {
                     let bad = f.prereq(ctx);
                     if (bad) warnings.push(f.label + ' ' + bad);
                 }
             }

             let barrelOk = length.cm * 10 > 12 * width.mm;
             if (!barrelOk) warnings.push('barrel length must be more than 12× the barrel width (have ' + length.cm + 'cm vs ' + width.mm + 'mm)');

             document.getElementById('FB-out-weight').innerText = Math.round(s.weight*100)/100;
             document.getElementById('FB-out-cost').innerText = Math.round(s.cost);
             document.getElementById('FB-out-avail').innerText = maxAge(availList);
             document.getElementById('FB-out-ri').innerText = s.ri + s.riSuffix;
             document.getElementById('FB-out-maxatk').innerText = Math.round(s.maxAtk);
             document.getElementById('FB-out-dmg').innerText = multiplyDamage(s.dmgMult, shot.damage);
             document.getElementById('FB-out-str2h').innerText = Math.round(s.str);
/*             document.getElementById('FB-out-str1h').innerText = Math.ceil(s.str*1.5);
             document.getElementById('FB-out-stroff').innerText = Math.round(s.str*2);*/
             document.getElementById('FB-out-mag').innerText = s.mag;
             document.getElementById('FB-out-mag-weight').innerText = formatter.format(typeof(s.mag)==typeof(1) ? s.mag * shot.weight : shot.weight);
             document.getElementById('FB-out-reload').innerText = reloadText;
/*             document.getElementById('FB-out-ammo').innerText = shot ? (ammoFamilyName + ' (' + width.mm + 'mm)') : (ammoFamilyName + ' -- no ' + width.mm + 'mm variant');*/
             document.getElementById('FB-out-special').innerText = s.special.join('; ');
             document.getElementById('FB-out-warnings').innerText = warnings.join('; ');
             document.getElementById('FB-tr-warnings').style.display = warnings.length ? 'table-row' : 'none';;
             
         }
      </script>
